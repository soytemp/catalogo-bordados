<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Bordado y Costura</title>
  <style>
    :root { --primary: #6d28d9; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: var(--primary); color: white; padding: 1.2rem; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    header h1 { margin: 0; font-size: 1.4rem; }
    .tasa-badge { background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-top: 6px; }
    .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 12px; max-width: 1000px; margin: auto; }
    .filtro-btn { border: 1px solid #cbd5e1; background: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .filtro-btn.activo { background: var(--primary); color: white; border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 12px; max-width: 1000px; margin: auto; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; position: relative; }
    .card img { width: 100%; height: 170px; object-fit: cover; background: #e2e8f0; }
    .badge-stock { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .disponible { background: #dcfce7; color: #166534; }
    .agotado { background: #fee2e2; color: #991b1b; }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: 700; font-size: 1.05rem; margin: 0 0 4px; }
    .card-cat { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
    .precios { margin: 8px 0; }
    .precio-bs { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .precio-usd { font-size: 0.85rem; color: #64748b; }
    .controles { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; background: #f1f5f9; border-radius: 8px; padding: 4px; }
    .controles button { width: 32px; height: 32px; border: none; background: white; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .controles button:disabled { opacity: 0.4; cursor: not-allowed; }
    .barra-carrito { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
    .btn-pagar { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 30; overflow-y: auto; padding: 16px; }
    .modal-content { background: white; max-width: 500px; margin: 20px auto; border-radius: 14px; padding: 20px; }
    .pago-box { background: #f1f5f9; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); margin: 12px 0; font-size: 0.9rem; }
    .btn-copiar { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-top: 8px; font-size: 0.85rem; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .btn-enviar { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-factura { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; display: none; text-align: center; text-decoration: none; }
    .btn-wa { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; display: none; text-align: center; text-decoration: none; }
    .exito-banner { display: none; background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>

<header>
  <h1 id="nombreTienda">Taller de Bordado y Costura</h1>
  <div class="tasa-badge" id="tasaInfo">Cargando tasa BCV...</div>
</header>

<div class="filtros" id="filtros"></div>
<div class="grid" id="catalogo"></div>

<div class="barra-carrito" id="barraCarrito" style="display:none;">
  <div>
    <div style="font-size:0.85rem; color:#cbd5e1;" id="resumenItems">0 artículos</div>
    <div style="font-weight:bold; font-size:1.1rem;" id="resumenTotal">Bs. 0,00</div>
  </div>
  <button class="btn-pagar" onclick="abrirModal()">Ver Pedido y Pagar</button>
</div>

<div class="modal" id="modalPago">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">Finalizar Pedido</h2>
      <button onclick="cerrarModal()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">×</button>
    </div>
    
    <div id="listaResumen" style="margin:12px 0; font-size:0.9rem; border-bottom:1px solid #e2e8f0; padding-bottom:10px;"></div>

    <div class="pago-box">
      <strong>Datos para Pago Móvil / Transferencia:</strong><br>
      <span id="datosPagoTexto"></span><br>
      <button class="btn-copiar" onclick="copiarDatosPago()">Copiar datos de Pago Móvil</button>
    </div>

    <form id="formPedido" onsubmit="enviarPedido(event)">
      <div class="form-group">
        <label>Nombre y Apellido / Razón Social *</label>
        <input type="text" id="clienteNombre" required placeholder="Ej: María Pérez">
      </div>
      <div class="form-group">
        <label>Cédula o RIF (para la factura) *</label>
        <input type="text" id="clienteCedula" required placeholder="Ej: V-12345678">
      </div>
      <div class="form-group">
        <label>Correo Electrónico (recibirás tu factura aquí) *</label>
        <input type="email" id="clienteCorreo" required placeholder="maria@correo.com">
      </div>
      <div class="form-group">
        <label>Teléfono / WhatsApp *</label>
        <input type="tel" id="clienteTelefono" required placeholder="0412-1234567">
      </div>
      <div class="form-group">
        <label>Código de Referencia del Pago *</label>
        <input type="text" id="pagoReferencia" required placeholder="Ej: 482910">
      </div>
      <div class="form-group">
        <label>Subir Capture del Pago *</label>
        <input type="file" id="pagoCapture" accept="image/*" required>
      </div>
      <button type="submit" class="btn-enviar" id="btnSubmit">Registrar Pago y Generar Factura</button>
    </form>

    <div class="exito-banner" id="exitoBanner"></div>
    <a id="btnFactura" class="btn-factura" target="_blank">📄 Ver / Descargar Factura Digital (PDF)</a>
    <a id="btnWhatsApp" class="btn-wa" target="_blank">💬 Enviar Factura y Pedido por WhatsApp</a>
  </div>
</div>

<script>
  // ==========================================
  // 1. CONFIGURACIÓN DE TU TIENDA (EDITA AQUÍ)
  // ==========================================
  const CONFIG = {
    nombreTienda: "Insumos y Bordados Creativos",
    whatsapp: "584121234567", // Tu número con código 58 sin el +
    tasaRespaldo: 45.50,      // Tasa de emergencia por si falla la conexión al BCV
    pagoMovil: {
      banco: "0102 - Banco de Venezuela",
      cedula: "V-12345678",
      telefono: "0412-1234567"
    },
    // Pega aquí la URL que te dio Google Apps Script en el Paso 1:
    googleScriptUrl: "https://script.google.com/macros/s/AKfycbxiD2zbMk_TTPnCxsffi45SRFBfjaeLiu8Ex_fK7xrwoEfNjS-39po3eyEoPmsJsUA7/exec"
  };

  // ==========================================
  // 2. INVENTARIO DE PRODUCTOS (EDITA AQUÍ)
  // ==========================================
  // Pon stock: 0 para que aparezca como AGOTADO automáticamente
  const PRODUCTOS = [
    { id: 1, nombre: "Cono de Hilo de Bordar (5000m)", categoria: "Hilos", precioUsd: 3.50, stock: 15, img: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=400" },
    { id: 2, nombre: "Madeja Hilo Mouline", categoria: "Hilos", precioUsd: 1.20, stock: 30, img: "https://images.unsplash.com/photo-1605000797499-95a51c5269ae?w=400" },
    { id: 3, nombre: "Bordado de Logo Personalizado", categoria: "Logos", precioUsd: 5.00, stock: 10, img: "https://images.unsplash.com/photo-1618220179428-22790b461013?w=400" },
    { id: 4, nombre: "Cuello Tejido Tipo Polo", categoria: "Cuellos", precioUsd: 2.50, stock: 8, img: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=400" },
    { id: 5, nombre: "Metro de Tela Popelina", categoria: "Telas", precioUsd: 4.00, stock: 0, img: "https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?w=400" },
    { id: 6, nombre: "Pelón / Entretela Bordado (Metro)", categoria: "Costura", precioUsd: 1.80, stock: 20, img: "https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400" }
  ];

  let tasaBcv = CONFIG.tasaRespaldo;
  let carrito = {};
  let categoriaActual = "Todos";

  async function cargarTasaBCV() {
    try {
      const res = await fetch("https://ve.dolarapi.com/v1/dolares/oficial");
      const data = await res.json();
      if (data && data.promedio) tasaBcv = parseFloat(data.promedio);
    } catch (e) {}
    document.getElementById("tasaInfo").innerText = `Tasa BCV del día: Bs. ${tasaBcv.toFixed(2)}`;
    renderCatalogo();
  }

  function renderFiltros() {
    const categorias = ["Todos", ...new Set(PRODUCTOS.map(p => p.categoria))];
    document.getElementById("filtros").innerHTML = categorias.map(cat =>
      `<button class="filtro-btn ${cat === categoriaActual ? 'activo' : ''}" onclick="filtrar('${cat}')">${cat}</button>`
    ).join("");
  }

  function filtrar(cat) {
    categoriaActual = cat;
    renderFiltros();
    renderCatalogo();
  }

  function renderCatalogo() {
    const filtrados = categoriaActual === "Todos" ? PRODUCTOS : PRODUCTOS.filter(p => p.categoria === categoriaActual);
    document.getElementById("catalogo").innerHTML = filtrados.map(p => {
      const cant = carrito[p.id] || 0;
      const bs = (p.precioUsd * tasaBcv).toFixed(2);
      const hayStock = p.stock > 0;
      return `
        <div class="card">
          <span class="badge-stock ${hayStock ? 'disponible' : 'agotado'}">
            ${hayStock ? `Disponible (${p.stock})` : 'Agotado'}
          </span>
          <img src="${p.img}" alt="${p.nombre}">
          <div class="card-body">
            <div>
              <div class="card-cat">${p.categoria}</div>
              <h3 class="card-title">${p.nombre}</h3>
            </div>
            <div>
              <div class="precios">
                <div class="precio-bs">Bs. ${bs}</div>
                <div class="precio-usd">Ref: $${p.precioUsd.toFixed(2)}</div>
              </div>
              <div class="controles">
                <button onclick="cambiarCant(${p.id}, -1)" ${cant === 0 ? 'disabled' : ''}>-</button>
                <span><strong>${cant}</strong></span>
                <button onclick="cambiarCant(${p.id}, 1)" ${!hayStock || cant >= p.stock ? 'disabled' : ''}>+</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function cambiarCant(id, delta) {
    const prod = PRODUCTOS.find(p => p.id === id);
    const nueva = (carrito[id] || 0) + delta;
    if (nueva <= 0) delete carrito[id];
    else if (nueva <= prod.stock) carrito[id] = nueva;
    renderCatalogo();
    actualizarBarra();
  }

  function actualizarBarra() {
    let items = 0, totalUsd = 0;
    for (let id in carrito) {
      const p = PRODUCTOS.find(x => x.id == id);
      items += carrito[id];
      totalUsd += p.precioUsd * carrito[id];
    }
    const barra = document.getElementById("barraCarrito");
    if (items === 0) { barra.style.display = "none"; return; }
    barra.style.display = "flex";
    document.getElementById("resumenItems").innerText = `${items} artículo(s)`;
    document.getElementById("resumenTotal").innerText = `Total: Bs. ${(totalUsd * tasaBcv).toFixed(2)} ($${totalUsd.toFixed(2)})`;
  }

  function abrirModal() {
    let html = "", totalUsd = 0;
    for (let id in carrito) {
      const p = PRODUCTOS.find(x => x.id == id);
      const subUsd = p.precioUsd * carrito[id];
      totalUsd += subUsd;
      html += `<div>${carrito[id]}x ${p.nombre} — <strong>Bs. ${(subUsd * tasaBcv).toFixed(2)}</strong></div>`;
    }
    const totalBs = (totalUsd * tasaBcv).toFixed(2);
    html += `<div style="margin-top:8px; font-size:1.1rem; color:var(--primary);"><strong>Total a pagar: Bs. ${totalBs}</strong> ($${totalUsd.toFixed(2)})</div>`;
    document.getElementById("listaResumen").innerHTML = html;
    document.getElementById("datosPagoTexto").innerHTML = `
      Banco: ${CONFIG.pagoMovil.banco}<br>
      Cédula: ${CONFIG.pagoMovil.cedula}<br>
      Teléfono: ${CONFIG.pagoMovil.telefono}<br>
      Monto exacto: <strong>Bs. ${totalBs}</strong>
    `;
    document.getElementById("modalPago").style.display = "block";
  }

  function cerrarModal() { document.getElementById("modalPago").style.display = "none"; }

  function copiarDatosPago() {
    const texto = `${CONFIG.pagoMovil.banco}\n${CONFIG.pagoMovil.cedula}\n${CONFIG.pagoMovil.telefono}`;
    navigator.clipboard.writeText(texto);
    alert("¡Datos de Pago Móvil copiados!");
  }

  async function enviarPedido(e) {
    e.preventDefault();
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerText = "Generando factura y guardando...";

    const fileInput = document.getElementById("pagoCapture");
    const base64 = await toBase64(fileInput.files[0]);

    let detallePedido = [], itemsDetalle = [], totalUsd = 0;
    for (let id in carrito) {
      const p = PRODUCTOS.find(x => x.id == id);
      const subUsd = p.precioUsd * carrito[id];
      detallePedido.push(`${carrito[id]}x ${p.nombre}`);
      itemsDetalle.push({
        nombre: p.nombre,
        cant: carrito[id],
        precioUsd: p.precioUsd.toFixed(2),
        subtotalBs: (subUsd * tasaBcv).toFixed(2)
      });
      totalUsd += subUsd;
    }
    const totalBs = (totalUsd * tasaBcv).toFixed(2);

    const payload = {
      nombre: document.getElementById("clienteNombre").value,
      cedulaCliente: document.getElementById("clienteCedula").value,
      correo: document.getElementById("clienteCorreo").value,
      telefono: document.getElementById("clienteTelefono").value,
      pedido: detallePedido.join(", "),
      itemsDetalle: itemsDetalle,
      totalUsd: totalUsd.toFixed(2),
      totalBs: totalBs,
      tasaBcv: tasaBcv.toFixed(2),
      referencia: document.getElementById("pagoReferencia").value,
      imagenBase64: base64
    };

    try {
      const response = await fetch(CONFIG.googleScriptUrl, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const resJson = await response.json();

      const numFac = resJson.numFactura || "Registrado";
      const pdfUrl = resJson.pdfUrl || "";

      const banner = document.getElementById("exitoBanner");
      banner.style.display = "block";
      banner.innerHTML = `✅ <strong>¡Pago registrado! Factura N° ${numFac}</strong><br>Enviamos una copia PDF a <em>${payload.correo}</em>.`;

      if (pdfUrl) {
        const btnFac = document.getElementById("btnFactura");
        btnFac.href = pdfUrl;
        btnFac.style.display = "block";
      }

      const msgWa = encodeURIComponent(
        `¡Hola! Registré mi pedido en la web:\n` +
        `🧾 *Factura:* ${numFac}\n` +
        `👤 *Cliente:* ${payload.nombre} (${payload.cedulaCliente})\n` +
        `🛍️ *Pedido:* ${payload.pedido}\n` +
        `💰 *Total:* Bs. ${totalBs} ($${payload.totalUsd})\n` +
        `🔢 *Ref. Pago:* ${payload.referencia}` +
        (pdfUrl ? `\n📄 *Factura PDF:* ${pdfUrl}` : "")
      );
      const btnWa = document.getElementById("btnWhatsApp");
      btnWa.href = `https://wa.me/${CONFIG.whatsapp}?text=${msgWa}`;
      btnWa.style.display = "block";
      btn.style.display = "none";
    try {
      const response = await fetch(CONFIG.googleScriptUrl, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      const textResult = await response.text();
      let resJson = {};
      try {
        resJson = JSON.parse(textResult);
      } catch (e) {
        console.log("Respuesta cruda de Google:", textResult);
        throw new Error("Google no devolvió JSON válido");
      }

      if (resJson.status === "error") {
        alert("Error interno en Google Sheets: " + resJson.message);
        btn.disabled = false;
        btn.innerText = "Registrar Pago y Generar Factura";
        return;
      }

      const numFac = resJson.numFactura || "Registrado";
      const pdfUrl = resJson.pdfUrl || "";

      const banner = document.getElementById("exitoBanner");
      banner.style.display = "block";
      banner.innerHTML = `✅ <strong>¡Pago registrado! Factura N° ${numFac}</strong><br>Enviamos una copia PDF a <em>${payload.correo}</em>.`;

      if (pdfUrl) {
        const btnFac = document.getElementById("btnFactura");
        btnFac.href = pdfUrl;
        btnFac.style.display = "block";
      }

      const msgWa = encodeURIComponent(
        `¡Hola! Registré mi pedido en la web:\n` +
        `🧾 *Factura:* ${numFac}\n` +
        `👤 *Cliente:* ${payload.nombre} (${payload.cedulaCliente})\n` +
        `🛍️ *Pedido:* ${payload.pedido}\n` +
        `💰 *Total:* Bs. ${totalBs} ($${payload.totalUsd})\n` +
        `🔢 *Ref. Pago:* ${payload.referencia}` +
        (pdfUrl ? `\n📄 *Factura PDF:* ${pdfUrl}` : "")
      );
      const btnWa = document.getElementById("btnWhatsApp");
      btnWa.href = `https://wa.me/${CONFIG.whatsapp}?text=${msgWa}`;
      btnWa.style.display = "block";
      btn.style.display = "none";
    } catch (err) {
      console.error("Detalle del error:", err);
      alert("Error al conectar: " + err.message);
      btn.disabled = false;
      btn.innerText = "Registrar Pago y Generar Factura";
    }
  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  document.getElementById("nombreTienda").innerText = CONFIG.nombreTienda;
  renderFiltros();
  cargarTasaBCV();
</script>
</body>
</html>
